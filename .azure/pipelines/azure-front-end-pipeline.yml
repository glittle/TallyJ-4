# azure-front-end-pipeline.yml
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**
      - version.json
    exclude:
      - backend/**

pr: none

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        pool:
          vmImage: "windows-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Install Node.js 22"

          - script: npm install
            displayName: "Npm Install"
            workingDirectory: "frontend"

          # English is the reference catalog. Keys that exist in en but not yet in
          # another locale print a per-locale count and do not fail the build.
          # The check fails the build on: stale keys, leaf-format errors, duplicate
          # keys, prefix collisions, a missing en locale, and unreadable JSON.
          - script: npm run validate:i18n
            displayName: "Validate i18n"
            workingDirectory: "frontend"

          # --- BUILD ---
          # Use "npm run build" (not bare "npx vite build") because it runs merge-locales first.
          # The bundled locale files (gitignored) are required to emit the locale-*.js chunks used
          # for dynamic language switching on the landing page (and elsewhere). Without them,
          # non-English locales have no resources and no network fetches occur on flag click.
          - script: npm run build
            displayName: "Build (merge-locales + vite build)"
            workingDirectory: "frontend"

          # This pipeline's only deployment target is UAT at https://uat.v4.tallyj.com
          # (Linux App Service tallyj4-uat). index.html pins Open Graph URLs at the
          # production origin (https://v4.tallyj.com) so a plain `npm run build` is
          # what production should publish. Rewrite the origin in dist/index.html
          # before zipping so UAT crawlers fetch the card from UAT. The deploy job
          # copies this dist into wwwroot of the combined site package. Do not
          # reuse this zip for production.
          - script: node scripts/set-og-origin.mjs https://uat.v4.tallyj.com dist/index.html
            displayName: "Point Open Graph URLs at the UAT origin"
            workingDirectory: "frontend"

          - task: ArchiveFiles@2
            displayName: "Zip Dist"
            inputs:
              rootFolderOrFile: "frontend/dist"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile: "$(Build.ArtifactStagingDirectory)/frontend.zip"

          # Publish zip
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: frontend_pkgs

  # lockBehavior belongs on the stage, not the deployment job. A stage id
  # plus lockBehavior creates a lock for this pipeline. sequential queues
  # later runs instead of the default runLatest, which cancels them. The
  # lock does not span the backend pipeline.
  - stage: DeployUat
    displayName: Deploy UAT to Azure App Service
    dependsOn: Build
    lockBehavior: sequential
    jobs:
      - deployment: DeployUat
        displayName: Deploy UAT to Azure App Service
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 90
        environment: tallyj4-uat
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-uat-appservice.yml
                  parameters:
                    currentArtifact: frontend_pkgs
                    otherPipelineId: "3"
                    otherArtifact: backend_pkg
