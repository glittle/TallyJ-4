# Combine this pipeline's package with the other half, then zip-deploy one site.
# App Service zip deploy replaces the whole site, so the frontend dist has to
# land inside the backend publish wwwroot before the deploy. Do not set app
# settings or the startup command; tallyj4-uat already runs `dotnet Backend.dll`.
#
# A push that starts both pipelines must ship both new halves. latestFromBranch
# only sees a completed succeeded run, so the deploy looks up the other
# definition on this commit and, when that run is still going, waits until it
# publishes its artifact. See scripts/deployment/select-sibling-run.py.

parameters:
  - name: currentArtifact
    type: string
    values:
      - backend_pkg
      - frontend_pkgs
  - name: otherPipelineId
    type: string
  - name: otherArtifact
    type: string
    values:
      - backend_pkg
      - frontend_pkgs

steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download ${{ parameters.currentArtifact }} from this run
    continueOnError: true
    inputs:
      buildType: current
      artifactName: ${{ parameters.currentArtifact }}
      targetPath: $(Pipeline.Workspace)/${{ parameters.currentArtifact }}

  # System.AccessToken is secret, so it is not placed in the process environment
  # until this step maps it. That is the YAML equivalent of the classic job
  # setting "Allow scripts to access the OAuth token". Non-secret predefined
  # variables (System.CollectionUri, System.TeamProjectId, Build.SourceVersion,
  # Build.SourceBranch) are already in the environment. The token reads builds
  # in this project; DownloadPipelineArtifact uses the same job token.
  - bash: python3 "$(Build.SourcesDirectory)/scripts/deployment/select-sibling-run.py"
    displayName: Find the other pipeline's run for this commit
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      OTHER_PIPELINE_ID: ${{ parameters.otherPipelineId }}
      OTHER_ARTIFACT: ${{ parameters.otherArtifact }}
      SIBLING_TIMEOUT_SECONDS: "2400"
      SIBLING_POLL_SECONDS: "30"

  # source: specific. runVersion: specific. pipelineId is the run id
  # (aliases: runId, buildId), not the definition id.
  - task: DownloadPipelineArtifact@2
    displayName: Download ${{ parameters.otherArtifact }} from the same commit
    condition: and(succeeded(), eq(variables['otherRunVersion'], 'specific'))
    continueOnError: true
    inputs:
      buildType: specific
      project: "TallyJ v4"
      definition: "${{ parameters.otherPipelineId }}"
      buildVersionToDownload: specific
      pipelineId: $(otherRunId)
      artifactName: ${{ parameters.otherArtifact }}
      targetPath: $(Pipeline.Workspace)/${{ parameters.otherArtifact }}

  - bash: |
      set -euo pipefail
      if [[ "${OTHER_RUN_VERSION}" != "specific" ]]; then
        exit 0
      fi
      case "${OTHER_ARTIFACT}" in
        backend_pkg) zip_name="Backend.zip" ;;
        frontend_pkgs) zip_name="frontend.zip" ;;
        *)
          echo "##vso[task.logissue type=error]Unknown artifact ${OTHER_ARTIFACT}."
          exit 1
          ;;
      esac
      zip_path="$(Pipeline.Workspace)/${OTHER_ARTIFACT}/${zip_name}"
      if [[ -f "$zip_path" ]]; then
        echo "Same-commit package is at $zip_path (run ${OTHER_RUN_ID})."
        exit 0
      fi
      echo "##vso[task.logissue type=warning]Run ${OTHER_RUN_ID} did not leave ${OTHER_ARTIFACT}/${zip_name}. Falling back to the latest successful run on refs/heads/main."
      echo "##vso[task.setvariable variable=otherRunVersion]latestFromBranch"
    displayName: Fall back when the same-commit package is missing
    env:
      OTHER_RUN_VERSION: $(otherRunVersion)
      OTHER_RUN_ID: $(otherRunId)
      OTHER_ARTIFACT: ${{ parameters.otherArtifact }}

  # source: specific. runVersion: latestFromBranch. Failed and partially
  # succeeded runs are excluded, including a run whose build published an
  # artifact and whose deploy then failed.
  - task: DownloadPipelineArtifact@2
    displayName: Download latest successful ${{ parameters.otherArtifact }} from main
    condition: and(succeeded(), ne(variables['otherRunVersion'], 'specific'))
    continueOnError: true
    inputs:
      buildType: specific
      project: "TallyJ v4"
      definition: "${{ parameters.otherPipelineId }}"
      buildVersionToDownload: latestFromBranch
      branchName: refs/heads/main
      allowFailedBuilds: false
      allowPartiallySucceededBuilds: false
      artifactName: ${{ parameters.otherArtifact }}
      targetPath: $(Pipeline.Workspace)/${{ parameters.otherArtifact }}

  - bash: |
      set -euo pipefail

      workspace="$(Pipeline.Workspace)"
      stage="$(Agent.TempDirectory)/uat-site"
      frontend_dir="$(Agent.TempDirectory)/uat-frontend"
      out="$(Build.ArtifactStagingDirectory)/tallyj4-uat.zip"
      backend_zip="$workspace/backend_pkg/Backend.zip"
      frontend_zip="$workspace/frontend_pkgs/frontend.zip"
      current_artifact='${{ parameters.currentArtifact }}'
      other_artifact='${{ parameters.otherArtifact }}'
      other_pipeline='${{ parameters.otherPipelineId }}'
      failed=0

      report_missing() {
        echo "##vso[task.logissue type=error]$1"
        echo "$1"
        failed=1
      }

      if [[ ! -f "$backend_zip" ]]; then
        if [[ "$current_artifact" == "backend_pkg" ]]; then
          report_missing "Missing backend package at $backend_zip. This run did not leave backend_pkg/Backend.zip. The UAT deploy cannot combine the site without the backend publish output."
        else
          report_missing "Missing backend package at $backend_zip. The other pipeline (definition ${other_pipeline}) did not leave Backend.zip, from this commit or from the latest successful run on refs/heads/main. If that pipeline has never succeeded on main, run it once before this deploy."
        fi
      fi

      if [[ ! -f "$frontend_zip" ]]; then
        if [[ "$current_artifact" == "frontend_pkgs" ]]; then
          report_missing "Missing frontend package at $frontend_zip. This run did not leave frontend_pkgs/frontend.zip. The UAT deploy cannot combine the site without the frontend dist."
        else
          report_missing "Missing frontend package at $frontend_zip. The other pipeline (definition ${other_pipeline}) did not leave frontend.zip, from this commit or from the latest successful run on refs/heads/main. If that pipeline has never succeeded on main, run it once before this deploy."
        fi
      fi

      if [[ "$failed" -ne 0 ]]; then
        echo "Pipeline workspace (depth 3):"
        find "$workspace" -maxdepth 3 -print || true
        exit 1
      fi

      if [[ "$current_artifact" == "$other_artifact" ]]; then
        echo "##vso[task.logissue type=error]Deploy template was called with the same artifact ($current_artifact) for both halves."
        exit 1
      fi

      if ! command -v unzip >/dev/null || ! command -v zip >/dev/null; then
        echo "##vso[task.logissue type=error]The deploy agent needs zip and unzip to build the combined UAT package."
        exit 1
      fi

      rm -rf "$stage" "$frontend_dir"
      mkdir -p "$stage" "$frontend_dir"
      unzip -q "$backend_zip" -d "$stage"
      unzip -q "$frontend_zip" -d "$frontend_dir"

      if [[ ! -f "$stage/Backend.dll" ]]; then
        echo "##vso[task.logissue type=error]Backend.zip does not contain Backend.dll at the archive root. The combined package has to be the publish output, not a nested folder."
        exit 1
      fi

      if [[ ! -f "$frontend_dir/index.html" ]]; then
        echo "##vso[task.logissue type=error]frontend.zip does not contain index.html at the archive root. The dist zip must not include a top-level folder."
        exit 1
      fi

      rm -rf "$stage/wwwroot"
      mkdir -p "$stage/wwwroot"
      cp -a "$frontend_dir"/. "$stage/wwwroot/"

      if [[ ! -f "$stage/wwwroot/index.html" ]]; then
        echo "##vso[task.logissue type=error]Failed to copy the frontend dist into wwwroot."
        exit 1
      fi

      # Use the staging directory variable directly. Command substitution
      # in this script is rewritten by the pipeline preprocessor.
      mkdir -p "$(Build.ArtifactStagingDirectory)"
      rm -f "$out"
      (
        cd "$stage"
        zip -qr "$out" .
      )

      echo "Combined UAT package: $out"
      echo "##vso[task.setvariable variable=uatPackage]$out"
    displayName: Combine backend publish and frontend dist

  - task: AzureWebApp@1
    displayName: Zip-deploy combined site to tallyj4-uat
    inputs:
      azureSubscription: azure-tallyj
      appType: webAppLinux
      appName: tallyj4-uat
      resourceGroupName: TallyJ3
      package: $(uatPackage)
      deploymentMethod: zipDeploy
