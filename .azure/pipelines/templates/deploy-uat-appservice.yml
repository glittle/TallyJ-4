# Combine this pipeline's package with the other half's latest successful
# artifact on main, then zip-deploy one site. App Service zip deploy replaces
# the whole site, so the frontend dist has to land inside the backend publish
# wwwroot before the deploy. Do not set app settings or the startup command;
# tallyj4-uat already runs `dotnet Backend.dll`.

parameters:
  - name: currentArtifact
    type: string
    values:
      - backend_pkg
      - frontend_pkgs
  - name: otherPipelineId
    type: string
  - name: otherArtifact
    type: string
    values:
      - backend_pkg
      - frontend_pkgs

steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download ${{ parameters.currentArtifact }} from this run
    continueOnError: true
    inputs:
      buildType: current
      artifactName: ${{ parameters.currentArtifact }}
      targetPath: $(Pipeline.Workspace)/${{ parameters.currentArtifact }}

  # source: specific. runVersion: latestFromBranch. definition id is the
  # other pipeline (3 = backend, 4 = frontend) in project "TallyJ v4".
  - task: DownloadPipelineArtifact@2
    displayName: Download ${{ parameters.otherArtifact }} from pipeline ${{ parameters.otherPipelineId }} on main
    continueOnError: true
    inputs:
      buildType: specific
      project: "TallyJ v4"
      definition: "${{ parameters.otherPipelineId }}"
      buildVersionToDownload: latestFromBranch
      branchName: refs/heads/main
      artifactName: ${{ parameters.otherArtifact }}
      targetPath: $(Pipeline.Workspace)/${{ parameters.otherArtifact }}

  - bash: |
      set -euo pipefail

      workspace="$(Pipeline.Workspace)"
      stage="$(Agent.TempDirectory)/uat-site"
      frontend_dir="$(Agent.TempDirectory)/uat-frontend"
      out="$(Build.ArtifactStagingDirectory)/tallyj4-uat.zip"
      backend_zip="$workspace/backend_pkg/Backend.zip"
      frontend_zip="$workspace/frontend_pkgs/frontend.zip"
      current_artifact='${{ parameters.currentArtifact }}'
      other_artifact='${{ parameters.otherArtifact }}'
      other_pipeline='${{ parameters.otherPipelineId }}'
      failed=0

      report_missing() {
        echo "##vso[task.logissue type=error]$1"
        echo "$1"
        failed=1
      }

      if [[ ! -f "$backend_zip" ]]; then
        if [[ "$current_artifact" == "backend_pkg" ]]; then
          report_missing "Missing backend package at $backend_zip. This run did not leave backend_pkg/Backend.zip. The UAT deploy cannot combine the site without the backend publish output."
        else
          report_missing "Missing backend package at $backend_zip. Download of backend_pkg from pipeline ${other_pipeline} (latest successful run on refs/heads/main) did not produce Backend.zip. If that pipeline has never succeeded on main, run it once before this deploy."
        fi
      fi

      if [[ ! -f "$frontend_zip" ]]; then
        if [[ "$current_artifact" == "frontend_pkgs" ]]; then
          report_missing "Missing frontend package at $frontend_zip. This run did not leave frontend_pkgs/frontend.zip. The UAT deploy cannot combine the site without the frontend dist."
        else
          report_missing "Missing frontend package at $frontend_zip. Download of frontend_pkgs from pipeline ${other_pipeline} (latest successful run on refs/heads/main) did not produce frontend.zip. If that pipeline has never succeeded on main, run it once before this deploy."
        fi
      fi

      if [[ "$failed" -ne 0 ]]; then
        echo "Pipeline workspace (depth 3):"
        find "$workspace" -maxdepth 3 -print || true
        exit 1
      fi

      if [[ "$current_artifact" == "$other_artifact" ]]; then
        echo "##vso[task.logissue type=error]Deploy template was called with the same artifact ($current_artifact) for both halves."
        exit 1
      fi

      if ! command -v unzip >/dev/null || ! command -v zip >/dev/null; then
        echo "##vso[task.logissue type=error]The deploy agent needs zip and unzip to build the combined UAT package."
        exit 1
      fi

      rm -rf "$stage" "$frontend_dir"
      mkdir -p "$stage" "$frontend_dir"
      unzip -q "$backend_zip" -d "$stage"
      unzip -q "$frontend_zip" -d "$frontend_dir"

      if [[ ! -f "$stage/Backend.dll" ]]; then
        echo "##vso[task.logissue type=error]Backend.zip does not contain Backend.dll at the archive root. The combined package has to be the publish output, not a nested folder."
        exit 1
      fi

      if [[ ! -f "$frontend_dir/index.html" ]]; then
        echo "##vso[task.logissue type=error]frontend.zip does not contain index.html at the archive root. The dist zip must not include a top-level folder."
        exit 1
      fi

      rm -rf "$stage/wwwroot"
      mkdir -p "$stage/wwwroot"
      cp -a "$frontend_dir"/. "$stage/wwwroot/"

      if [[ ! -f "$stage/wwwroot/index.html" ]]; then
        echo "##vso[task.logissue type=error]Failed to copy the frontend dist into wwwroot."
        exit 1
      fi

      # Use the staging directory variable directly. Command substitution
      # in this script is rewritten by the pipeline preprocessor.
      mkdir -p "$(Build.ArtifactStagingDirectory)"
      rm -f "$out"
      (
        cd "$stage"
        zip -qr "$out" .
      )

      echo "Combined UAT package: $out"
      echo "##vso[task.setvariable variable=uatPackage]$out"
    displayName: Combine backend publish and frontend dist

  - task: AzureWebApp@1
    displayName: Zip-deploy combined site to tallyj4-uat
    inputs:
      azureSubscription: azure-tallyj
      appType: webAppLinux
      appName: tallyj4-uat
      resourceGroupName: TallyJ3
      package: $(uatPackage)
      deploymentMethod: zipDeploy
