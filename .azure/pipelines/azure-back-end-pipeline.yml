# azure-back-end-pipeline.yml
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - Backend.Tests/**
      - version.json
    exclude:
      - frontend/**

pr: none

pool:
  vmImage: "windows-latest"

variables:
  buildConfiguration: "Release"

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK from global.json"
            inputs:
              packageType: "sdk"
              useGlobalJson: true
              workingDirectory: "$(Build.SourcesDirectory)"

          # 1. Run Tests (Updated path to find Backend.Tests at the root)
          - task: DotNetCoreCLI@2
            displayName: "Run Unit Tests"
            inputs:
              command: "test"
              projects: "**/*Tests/*.csproj" # Finds any .csproj in a folder ending in 'Tests'
              arguments: "--configuration $(buildConfiguration) --verbosity quiet"

          # 2. Package Web Project
          - task: DotNetCoreCLI@2
            displayName: "Package Web Project"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "backend/Backend.csproj"
              # REMOVED --output from arguments; the task handles this via zipAfterPublish
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)"
              zipAfterPublish: true

          # This will now reliably find the zip file created by the task
          - publish: $(Build.ArtifactStagingDirectory)/Backend.zip
            artifact: backend_pkg
            displayName: "Publish Artifact"

  # lockBehavior belongs on the stage, not the deployment job. A stage id
  # plus lockBehavior creates a lock for this pipeline. sequential queues
  # later runs instead of the default runLatest, which cancels them. The
  # lock does not span the frontend pipeline.
  - stage: DeployUat
    displayName: Deploy UAT to Azure App Service
    dependsOn: Build
    lockBehavior: sequential
    jobs:
      - deployment: DeployUat
        displayName: Deploy UAT to Azure App Service
        pool:
          vmImage: ubuntu-24.04
        timeoutInMinutes: 90
        environment: tallyj4-uat
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy-uat-appservice.yml
                  parameters:
                    currentArtifact: backend_pkg
                    otherPipelineId: "4"
                    otherArtifact: frontend_pkgs
